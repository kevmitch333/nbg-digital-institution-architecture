name: Build Hostinger deployment branch

on:
  push:
    branches:
      - codex/hostinger-staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source
        run: npx oxlint app components --ignore-pattern components/ui

      - name: Build static website
        run: npm run build

      - name: Verify deployment output
        shell: bash
        run: |
          test -f out/index.html
          test -f out/founder/index.html
          test -f out/advisory/index.html
          test -f out/404.html
          test "$(find out/ventures -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 8

      - name: Publish finished files to hostinger-deploy
        shell: bash
        run: |
          cp -a out/. "$RUNNER_TEMP/hostinger-site"
          git switch --orphan hostinger-deploy
          cp -a "$RUNNER_TEMP/hostinger-site/." .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force origin hostinger-deploy
